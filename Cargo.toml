[package]
name = "pico-otp"
version = "0.2.1"
edition = "2024"
authors = ["Piers Finlayson <piers@piers.rocks>"]
description = "Generate and decode OTP data for the Raspberry Pi RP2350/Pico 2"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/piersfinlayson/pico-otp"
repository = "https://github.com/piersfinlayson/pico-otp.git"
keywords = ["raspberry-pi", "rp2350", "pico-otp", "otp"]
categories = ["embedded", "hardware-support"]
readme = "README.md"

[[bin]]
name = "pico-otp"
path = "src/bin/main.rs"
required-features = ["cli"]

[lib]
name = "pico_otp"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
clap = { version = "4.4", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3.3"
# Used by examples/generate-whitelabel.rs
prettyplease = "0.2"
syn = { version = "2.0", default-features = false, features = ["full", "parsing"] }
typify = { version = "0.5", default-features = false }
